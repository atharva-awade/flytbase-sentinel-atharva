# SigLIP2 zero-shot text prompts per class (PLAN.md §5.2). Class embedding = mean of its prompts.
# Three viewpoints are mixed on purpose: the data is drone + CCTV + dashcam.
normal:
  - "aerial view of traffic flowing smoothly on a highway"
  - "drone view of a city street with cars driving normally"
  - "CCTV footage of an ordinary intersection with moving traffic"
  - "dashcam view of a road with normal traffic ahead"
  - "cars parked neatly in a parking lot seen from above"
  - "an empty quiet street at night with streetlights"
  - "pedestrians walking normally on a sidewalk"
  - "aerial view of a park with people walking"
  - "people playing basketball, soccer or outdoor sports on a court"
  - "players running, jumping and passing a ball in an athletic sports game"
  - "recreational athletic activity, people playing a sports match in a park or court"
  - "ordinary outdoor recreation, sports game, or playground activity"
  - "vehicles briefly waiting at a red traffic light or pedestrian crosswalk"
  - "delivery van or bus making a routine brief stop at a designated stop"
  - "wet asphalt and reflections after routine rain without flooding"
  - "morning mist, thin weather haze or ordinary car exhaust"
  - "people waiting at a bus stop, resting on a park bench, or standing in public"
traffic_accident:
  - "aerial view of a car crash with collided damaged vehicles on the road"
  - "two vehicles colliding at an intersection with visible impact damage"
  - "an overturned car on a highway after an accident with emergency response"
  - "motorcycle crash on the road with a rider thrown to the ground"
  - "dashcam footage of a vehicle collision with crushed metal ahead"
  - "damaged vehicles and scattered wreck debris after a road accident"
traffic_congestion:
  - "aerial view of a long traffic jam with many cars stopped bumper to bumper across multiple lanes"
  - "heavy traffic congestion on a highway, long continuous line of vehicles barely moving"
  - "gridlocked multi-lane road full of stationary vehicles extending beyond the intersection"
stalled_or_broken_down_vehicle:
  - "a single disabled car stopped on the highway shoulder with hazard flashers on"
  - "broken down truck stationary in a live traffic lane with hood open while other traffic passes"
  - "aerial view of an immobilized vehicle with driver standing outside seeking help"
vehicle_blocking_traffic:
  - "a stopped vehicle obstructing active traffic lanes forcing all cars to swerve around it"
  - "truck jackknifed or stuck across an intersection completely blocking traffic flow"
  - "aerial view of an obstruction where a car prevents others from passing through"
fire:
  - "aerial view of a vehicle on fire with bright open orange flames and combustion"
  - "building or structure actively burning with visible roaring flames"
  - "burning car on the roadside engulfed in visible open fire"
smoke:
  - "thick grey or black smoke plume rising from a combustion fire seen from above"
  - "dense dark smoke cloud billowing over a city street from an incident"
  - "heavy smoke drifting across a highway obscuring vehicle vision"
waterlogging_or_flood:
  - "flooded roadway with deep standing water submerging vehicle wheels"
  - "aerial view of a waterlogged street where cars cannot pass through deep floodwaters"
  - "vehicles stranded and stalled in deep street floodwater after heavy rain"
wrong_way_driving:
  - "a car driving against the flow of traffic into oncoming vehicles on a highway"
  - "vehicle moving in the opposite direction on a divided one-way road"
  - "aerial view of a vehicle heading straight into oncoming traffic lanes"
road_spill_or_debris:
  - "large hazardous cargo or loose objects lying in the active roadway lane"
  - "cargo spilled from a freight truck scattered across multiple highway lanes"
  - "aerial view of bulky debris, rocks, or large boxes obstructing vehicle path"
fighting_or_violence:
  - "people violently fighting on the street, punching, striking and kicking each other"
  - "a violent physical brawl or street brawl between individuals striking each other"
  - "CCTV footage of an aggressive physical assault, beating or violent fight on a sidewalk"
  - "people violently attacking and wrestling each other aggressively in public"
loitering_or_suspicious_presence:
  - "a person lingering suspiciously near a secure fence or perimeter at night"
  - "someone trespassing or lurking alone by a closed facility or restricted area"
  - "aerial view of an unauthorized person wandering in a restricted utility site"

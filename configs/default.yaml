# SENTINEL runtime configuration (PLAN.md). Override with --config or env SENTINEL_*.
paths:
  data_dir: data
  cache_dir: cache
  banks_dir: banks
  submissions_dir: submissions
  priors: configs/class_priors.yaml
  prompt_bank: configs/prompt_bank.yaml
  question_bank: configs/question_bank.yaml

ingest:
  sample_fps_l1: 2.0
  max_frames_l1: 16
  sample_fps_l23: 1.0
  max_side: 448

gate:
  model_id: google/siglip2-base-patch16-224
  device: cuda            # cuda | cpu
  batch_size: 32
  night_lum_thresh: 40
  w_class: 0.5            # weights in suspicion u[t]
  w_novelty: 0.3
  w_motion: 0.2
  tau_gate: 0.45          # seconds with u >= tau_gate become candidate windows (sweep this)
  pad_sec: 3
  max_wake_ratio: 0.35    # safety cap: never send more than this fraction of seconds to the VLM
  normal_bank: banks/normal.npy

verifier:
  backend: openai         # openai (vLLM / llama.cpp server / NIM-compatible) | mock
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3-VL-4B-Instruct
  frames_per_window: 6
  window_sec: 12
  stride_sec: 6
  max_side: 448
  motion_tint: true
  top_k_classes: 4
  self_consistency: true
  min_conf: 0.55
  temperature_probe: 0.6
  timeout_s: 60
  max_concurrency: 2

fusion:
  alpha: 0.3
  beta: 0.7

emit:
  submission_id_prefix: sentinel
  model_name: sentinel-cascade-siglip2-qwen3vl4b
  hardware: "1x T4 16GB"
